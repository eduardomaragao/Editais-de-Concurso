[project]
name = "editais-backend"
version = "0.1.0"
description = "Parser de editais (PDF -> JSON), API, painel admin e radar de retificacoes"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25",
    "jsonschema>=4.23",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
]
# Producao com Postgres (dev usa SQLite): pip install -e ".[api,postgres]"
postgres = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editais"]

[tool.pytest.ini_options]
testpaths = ["tests"]

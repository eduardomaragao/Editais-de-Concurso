# Blueprint do Render: cria o backend (FastAPI) + Postgres de uma vez.
# No Render: New > Blueprint > aponte para este repositório.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: editais-db
    databaseName: editais
    user: editais
    plan: free # trocar por 'basic' quando for pra valer (o free tem prazo)

services:
  - type: web
    name: editais-backend
    runtime: python
    plan: free # 'free' dorme após 15 min ocioso; 'starter' fica sempre no ar
    rootDir: backend
    buildCommand: pip install -e ".[api,postgres]"
    startCommand: python -m uvicorn --factory editais.admin.app:criar_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EDITAIS_DATABASE_URL
        fromDatabase:
          name: editais-db
          property: connectionString
      - key: EDITAIS_ADMIN_USUARIO
        value: admin
      - key: EDITAIS_ADMIN_SENHA
        generateValue: true # o Render gera uma senha forte; você a lê no painel

  - type: web
    name: editais-legal
    runtime: static
    plan: free
    rootDir: site-legal
    staticPublishPath: .
    buildCommand: "" # sem build — e so HTML puro
